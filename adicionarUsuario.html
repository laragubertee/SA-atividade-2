<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="adicionarUsuario.css">

<title>Adicionar Usuário</title>
</head>

<body>

<div class="container">

    <div class="top-icons">
        <i class="bi bi-gear"></i>
        <i class="bi bi-moon-fill"></i>
        <img src="logo.png" class="logo">
    </div>

    <div class="titulo">
        <a href="gerenciamentoUsuario.html">
            <i class="bi bi-arrow-left-circle-fill"></i>
        </a>

        <h1>Adicionar Usuário</h1>
    </div>

    <div class="subtitulo">
        <i class="bi bi-person-fill"></i>
        <h2>Informações Pessoais</h2>
    </div>

    <div class="campos-topo">

        <input
            type="text"
            id="nome"
            placeholder="Nome Completo">

        <input
            type="email"
            id="email"
            placeholder="Email">

        <input
            type="tel"
            id="telefone"
            placeholder="Telefone">

    </div>

    <div class="area-usuario">

        <div class="upload">

            <label for="foto">
                <i class="bi bi-camera-fill"></i>
                <p>Clique para adicionar ou arraste a imagem</p>
            </label>

            <input type="file" id="foto" hidden>

        </div>

        <div class="dados-login">

            <label>Nome de Usuário</label>

            <input
                type="text"
                id="usuario"
                placeholder="Digite o nome de usuário">

            <label>Senha Temporária</label>

            <div class="senha">

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite uma senha">

                <i class="bi bi-eye"></i>

            </div>

        </div>

    </div>

    <div class="titulo-secao">Cargo</div>

    <select id="cargo">
        <option selected disabled>Selecione o cargo</option>
        <option>Cliente</option>
        <option>Gestor</option>
        <option>Maquinista</option>
    </select>

    <div class="titulo-secao">
        Permissões de Acesso
    </div>

    <div class="permissoes">

        <label>
            <input type="checkbox">
            Acesso ao painel de monitoramento
        </label>

        <label>
            <input type="checkbox">
            Visualizar relatórios
        </label>

        <label>
            <input type="checkbox">
            Gerenciar estações
        </label>

        <label>
            <input type="checkbox">
            Manutenção e alertas
        </label>

        <label>
            <input type="checkbox">
            Cadastrar trens
        </label>

        <label>
            <input type="checkbox">
            Gerenciar usuários
        </label>

        <label>
            <input type="checkbox">
            Fazer edições no sistema
        </label>

    </div>

    <div class="titulo-secao">
        Status da Conta
    </div>

    <select id="status">
        <option>Ativo</option>
        <option>Inativo</option>
        <option>Bloqueado</option>
    </select>

    <div class="botoes">

        <button
            type="button"
            onclick="window.location.href='gerenciamentoUsuario.html'">
            Cancelar
        </button>

        <button
            type="button"
            id="btnSalvar">
            Salvar
        </button>

    </div>

</div>

<script src="adicionarUsuario.js"></script>

</body>
</html>
