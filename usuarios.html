<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status de Usuários</title>


    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

   
    <link rel="stylesheet" href="usuario.css">
</head>

<body>

<div class="container">

    <header class="topo">

        <button class="btn-voltar">
            <i class="bi bi-arrow-left-circle-fill"></i>
        </button>

        <div class="titulo">
            <h1>Status de Usuários</h1>
        </div>

    </header>

    <div class="card-status">

        <div class="icone">
            <i class="bi bi-person-circle"></i>
        </div>

        <div class="numero">24</div>

        <div class="texto">
            <h3>Total de Usuários</h3>
            <a href="gerenciamentoUsuario.html">Ver todos</a>
        </div>

    </div>

    <div class="card-status">

        <div class="icone ativo">
            <i class="bi bi-check-circle"></i>
        </div>

        <div class="numero">16</div>

        <div class="texto">
            <h3>Usuários Ativos</h3>
            <a href="gerenciamentoUsuario.html">Ver todos</a>
        </div>

    </div>


    <div class="card-status">

        <div class="icone">
            <i class="bi bi-clock-history"></i>
        </div>

        <div class="numero">3</div>

        <div class="texto">
            <h3>Usuários Inativos</h3>
            <a href="gerenciamentoUsuario.html">Ver todos</a>
        </div>

    </div>


    <div class="card-status">

        <div class="icone">
            <i class="bi bi-person-lock"></i>
        </div>

        <div class="numero">1</div>

        <div class="texto">
            <h3>Usuários Bloqueados</h3>
            <a href="gerenciamentoUsuario.html">Ver todos</a>
        </div>

    </div>

</div>

</body>
</html>
