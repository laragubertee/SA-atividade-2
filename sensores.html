<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Sensores</title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="sensores.css">
</head>

<body>

    <aside class="menu-lateral" id="menu">

        <div class="menu-topo">

            <a href="#">
                <i class="bi bi-arrow-left-circle-fill"></i>
            </a>

            <h2>Sensores</h2>

        </div>

        <h3>Selecione uma opção:</h3>

        <nav>

            <a href="#">
                <i class="bi bi-plus-circle-fill"></i>
                Adicionar Sensor
            </a>

            <a href="#">
                <i class="bi bi-dash-circle-fill"></i>
                Remover Sensor
            </a>

            <a href="#">
                <i class="bi bi-pencil-fill"></i>
                Editar Sensor
            </a>

        </nav>

    </aside>

    <main class="conteudo">

        <div class="topo">

            <button id="btnMenu" class="btn-menu">
                <i class="bi bi-list"></i>
            </button>

            <div class="icones">

                <i class="bi bi-gear"></i>

                <i class="bi bi-moon-fill"></i>

                <i class="bi bi-bell"></i>

            </div>

        </div>

        <h1>Informações</h1>

        <div class="campo">

            <label>Selecione o tipo de sensor:</label>

            <select>
                <option>Sensor - KY-037</option>
                <option>Sensor - KY-038</option>
                <option>Sensor - KY-039</option>
            </select>

        </div>
        <div class="campo">

            <label>Selecione o local do sensor:</label>

            <select>
                <option>Trilho 1</option>
                <option>Trilho 2</option>
                <option selected>Trilho 3</option>
            </select>

        </div>
        <div class="campo">

            <label>Selecione a data da adição:</label>

            <input type="date">

        </div>
        <div class="campo">

            <label>Descreva o procedimento:</label>

            <input type="text">

        </div>
        <div class="trem">

            <img src="trem.png" alt="Trem">

        </div>

    </main>

    <script src="sensores.js"></script>

</body>
</html>
