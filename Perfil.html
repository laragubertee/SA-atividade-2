<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
</head>
<body>
     <div class="screen-container">
        <p class="screen-title">Perfil</p>
        <header>
            <h1>Perfil</h1>
            <div>
                <button>Acessibilidade (✋)</button>
                <button>Configurações (⚙️)</button>
                <button>Modo Escuro (🌙)</button>
            </div>
        </header>

        <main>
            <section style="background:transparent; border:none; text-align:center;">
                <img src="" alt="Foto de Perfil da Usuária" style="background:#30363d; min-height:80px; width:80px; border-radius:50%;">
            </section>

            <div>
                <label for="input-nome">Nome</label>
                <div style="display:flex; gap:5px;">
                    <input type="text" id="input-nome" value="Nome" readonly>
                    <button aria-label="Editar Nome" style="width:auto; margin:5px 0 0 0; padding:5px 10px;">✏️</button>
                </div>
            </div>

            <form style="display:flex; flex-direction:column; gap:10px;">
                <p>
                    <label for="email"><strong>E-mail:</strong></label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com">
                </p>
                <p>
                    <label for="telefone"><strong>Telefone:</strong></label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
                </p>
                <p>
                    <label for="endereco"><strong>Endereço:</strong></label>
                    <input type="text" id="endereco" name="endereco" placeholder="Rua, Número, Bairro, Cidade">
                </p>
            </form>
            <button type="button" style="background-color: #da3633; margin-top:auto;">Sair</button>
        </main>
    </div>

    
</body>
</html>
