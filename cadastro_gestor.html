<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro Gestor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<div class="container py-4">

    <!-- Botão Menu -->
    <div class="mb-3">
        <button class="btn border-0 fs-3 p-0">
            <i class="fa-solid fa-bars text-secondary"></i>
        </button>
    </div>

    <div class="mx-auto" style="max-width:420px;">

        <!-- Título -->
        <div class="text-center mb-4">
            <h1 class="fw-bold text-primary">
                GESTOR
            </h1>
        </div>

        <!-- Formulário -->

        <form>

            <div class="mb-3">
                <input
                    type="text"
                    class="form-control rounded-4 border-0 bg-secondary-subtle py-3"
                    placeholder="Matricula Profissional">
            </div>

            <div class="mb-3">
                <input
                    type="text"
                    class="form-control rounded-4 border-0 bg-secondary-subtle py-3"
                    placeholder="Empresa Ferroviária">
            </div>

            <div class="mb-3">
                <input
                    type="email"
                    class="form-control rounded-4 border-0 bg-secondary-subtle py-3"
                    placeholder="Região de atuação">
            </div>

             <div class="mb-4">
                <select class="form-select rounded-4 border-0 bg-secondary-subtle py-3">

                    <option selected disabled>
                        Turno
                    </option>

                    <option>Matutino</option>
                    <option>Vespertino</option>
                    <option>Noturno</option>

                </select>
            </div>

            <div class="mb-3">
                <input
                    type="tel"
                    class="form-control rounded-4 border-0 bg-secondary-subtle py-3"
                    placeholder="N° de indetificação">
            </div>

            <div class="mb-3">
                <input
                    type="password"
                    class="form-control rounded-4 border-0 bg-secondary-subtle py-3"
                    placeholder="Senha">
            </div>

             <div class="mb-3">
                <input
                    type="password"
                    class="form-control rounded-4 border-0 bg-secondary-subtle py-3"
                    placeholder="Confirmar senha">
            </div>

           

            <div class="d-grid">

                <button
                    type="submit"
                    class="btn btn-primary rounded-pill fw-bold py-3">

                    ENTRAR

                </button>

            </div>

        </form>

        <!-- Logo -->
        <div class="text-center mt-5">
            <img src="logo.png" class="logo" alt="Logo">
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
