<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Rotas</title>
</head>
<body>
     <div class="screen-container">
        <p class="screen-title">Adicionar Rotas</p>
        <header>
            <h1>Adicionar Rotas</h1>
            <div>
                <button>Acessibilidade (✋)</button>
                <button>Configurações (⚙️)</button>
                <button>Modo Escuro (🌙)</button>
            </div>
        </header>

        <main>
            <h2>Informações :</h2>
            <form style="display:flex; flex-direction:column; gap:15px;">
                <div>
                    <label for="destino">Selecione o destino:</label>
                    <select id="destino">
                        <option value="">Ex: Joinville</option>
                    </select>
                </div>
                <div>
                    <label for="partida">Selecione o ponto de partida:</label>
                    <select id="partida">
                        <option value="">Ex: Joinville</option>
                    </select>
                </div>
                <div>
                    <label for="data">Data</label>
                    <input type="date" id="data" value="2026-06-09">
                </div>
                <button type="button" style="background-color: #da3633; margin-top:20px;">Excluir Rota</button>
            </form>
        </main>

        <footer>
            <nav>
                <ul>
                    <li><a href="#"><span>🏠</span><p>Início</p></a></li>
                    <li><a href="#"><span>📄</span><p>Menu</p></a></li>
                    <li><a href="#"><span>🛒</span><p>Estoque</p></a></li>
                    <li><a href="#"><span>👥</span><p>Funcionários</p></a></li>
                </ul>
            </nav>
        </footer>
    </div>

    
</body>
</html>
