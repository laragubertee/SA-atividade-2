<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Usuários</title>
</head>

<body>

<div class="celular">

    <header>

        <div class="titulo">
            <div>
                <h1>Usuários</h1>
                <p>Gerenciamento de usuário</p>
            </div>
        </div>

    </header>

    <div class="container">

        <button class="btn-azul">
            Buscar usuário
        </button>

        <button class="btn-azul">
            Adicionar Usuário
        </button>

      <table class="tabela-usuarios">
    <thead>
        <tr>
            <th>Usuário</th>
            <th>Cargo</th>
            <th>Status</th>
            <th>Permissões</th>
        </tr>
    </thead>

    <tbody>

        <tr>
            <td class="usuario">
                <img src="img/user1.png">
                <div>
                    <strong>Nicolas Boston</strong>
                    <small>nicolas@gmail.com</small>
                </div>
            </td>

            <td>
                <span class="cargo">Gestor</span>
            </td>

            <td>
                <span class="ativo">Ativo</span>
            </td>

            <td>
                <select>
                    <option>Permissão</option>
                </select>
            </td>
        </tr>

        <tr>
            <td class="usuario">
                <img src="img/user2.png">
                <div>
                    <strong>Marcos Andrade</strong>
                    <small>marcos@gmail.com</small>
                </div>
            </td>

            <td>
                <span class="cargo">Cliente</span>
            </td>

            <td>
                <span class="bloqueado">Bloqueado</span>
            </td>

            <td>
                <select>
                    <option>Permissão</option>
                </select>
            </td>
        </tr>

        <tr>
            <td class="usuario">
                <img src="img/user3.png">
                <div>
                    <strong>Felipe Vieira</strong>
                    <small>felipe@gmail.com</small>
                </div>
            </td>

            <td>
                <span class="cargo">Cliente</span>
            </td>

            <td>
                <span class="inativo">Inativo</span>
            </td>

            <td>
                <select>
                    <option>Permissão</option>
                </select>
            </td>
        </tr>

    </tbody>
</table>

        <button class="btn-bloquear">
            Bloquear

        </button>

    </div>

</div>

</body>
</html>
